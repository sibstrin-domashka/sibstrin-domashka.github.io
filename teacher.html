<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Домашка — вход для преподавателей</title>
<meta name="theme-color" content="#051F20">
<link rel="manifest" href="manifest-teacher.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0;background:#051F20;color:#DAF1DE;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
<script>
  // Вход у всех теперь один: auth.html (вкладка «Я преподаватель»).
  // Эта страница оставлена, чтобы старые ссылки и закладки продолжали работать.
  (function(){
    var q = new URLSearchParams(location.search);
    q.set("role", "teacher");
    location.replace("auth.html?" + q.toString());
  })();
</script>
</head>
<body>Открываю вход для преподавателей…</body>
</html>
